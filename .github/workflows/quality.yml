name: Verificações de qualidade

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tipos, testes e compilação
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: arremataflow_test
          POSTGRES_USER: arremataflow
          POSTGRES_PASSWORD: arremataflow_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arremataflow -d arremataflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://arremataflow:arremataflow_ci_password@127.0.0.1:5432/arremataflow_test
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:3000
      DOCUMENT_STORAGE_PATH: /tmp/arremataflow-documents
      NODE_ENV: test
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Validar e instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Aplicar migrações em banco temporário
        run: pnpm db:migrate

      - name: Preparar dados mínimos de teste
        run: node scripts/seed-ci-test-data.mjs

      - name: Verificar tipos
        run: pnpm typecheck

      - name: Executar testes
        run: pnpm test:ci

      - name: Compilar versão de produção
        run: pnpm build

      - name: Validar imagem Docker de produção
        run: docker build --tag arremataflow:ci .

  container-smoke-test:
    name: Aplicação e PostgreSQL em contêineres
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar variáveis locais de teste
        run: |
          cp .env.example .env
          cp .env.docker.example .env.docker

      - name: Subir aplicação e banco
        run: docker compose --env-file .env.docker up --detach --build --wait --wait-timeout 180

      - name: Validar saúde da aplicação
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8081/health/live
          curl --fail --silent --show-error http://127.0.0.1:8081/health/ready

      - name: Reiniciar aplicação e validar recuperação
        run: |
          docker compose --env-file .env.docker restart app
          timeout 90 sh -c 'until curl --fail --silent http://127.0.0.1:8081/health/ready; do sleep 2; done'

      - name: Exibir diagnóstico em caso de falha
        if: failure()
        run: docker compose --env-file .env.docker logs --no-color

      - name: Encerrar contêineres de teste
        if: always()
        run: docker compose --env-file .env.docker down --volumes
